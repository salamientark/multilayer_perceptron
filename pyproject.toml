[project]
name = "ft-mlp"
version = "0.1.0"
description = "Multilayer perceptron trained from scratch on the Wisconsin breast cancer dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyqt5>=5.15",
]

[project.scripts]
ft-train = "ft_mlp.train:cli"
ft-predict = "ft_mlp.predict:cli"
ft-split-dataset = "ft_mlp.split_dataset:cli"
ft-analyse-data = "ft_mlp.analyse_data:cli"

[dependency-groups]
dev = [
    "flake8>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ft_mlp"]
